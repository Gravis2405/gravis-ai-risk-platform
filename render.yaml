services:
  - type: web
    name: gravis-ai-risk-platform
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://gravis-ai-risk-platform.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gravis-ai-preview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: INGEST_API_KEY
        generateValue: true
